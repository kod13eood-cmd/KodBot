<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">KodBot</title>
  <desc id="desc">A mint-green K monogram on a dark rounded tile, with a small cursor point in the negative space.</desc>

  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A120E" />
      <stop offset="55%" stop-color="#10251B" />
      <stop offset="100%" stop-color="#07100B" />
    </linearGradient>
    <linearGradient id="mark" x1="220" y1="160" x2="820" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C7FFE1" />
      <stop offset="38%" stop-color="#5DF0AE" />
      <stop offset="78%" stop-color="#24C57D" />
      <stop offset="100%" stop-color="#0B8A55" />
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="24%" r="72%">
      <stop offset="0%" stop-color="#38D591" stop-opacity="0.20" />
      <stop offset="62%" stop-color="#38D591" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#38D591" stop-opacity="0" />
    </radialGradient>
    <clipPath id="tile-clip">
      <rect width="1024" height="1024" rx="228" />
    </clipPath>
  </defs>

  <g clip-path="url(#tile-clip)">
    <rect width="1024" height="1024" fill="url(#tile)" />
    <rect width="1024" height="1024" fill="url(#glow)" />

    <!-- A quiet grid, so the tile reads as a surface rather than a flat square. -->
    <g stroke="#8FF3C4" stroke-opacity="0.055" stroke-width="2">
      <path d="M128 0V1024M256 0V1024M384 0V1024M512 0V1024M640 0V1024M768 0V1024M896 0V1024" />
      <path d="M0 128H1024M0 256H1024M0 384H1024M0 512H1024M0 640H1024M0 768H1024M0 896H1024" />
    </g>

    <!-- K: a stem and one folded diagonal, with rounded terminals. -->
    <g fill="none" stroke="url(#mark)" stroke-width="112" stroke-linecap="round" stroke-linejoin="round">
      <path d="M326 280V744" />
      <path d="M702 280L424 512L702 744" />
    </g>
  </g>
</svg>
